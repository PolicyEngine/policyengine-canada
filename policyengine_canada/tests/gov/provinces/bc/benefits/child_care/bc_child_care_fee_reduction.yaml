# --- Edge case: newborn age 0 gets infant/toddler rate (S17) ---

- name: Edge case - newborn age 0 gets infant/toddler rate
  period: 2024
  input:
    people:
      parent:
        age: 28
      newborn:
        age: 0
    households:
      household:
        province_code: BC
        members: [parent, newborn]
  output:
    # Age 0 < preschool_age threshold => is_infant_toddler = True
    # Monthly reduction = $900 (infant_toddler rate)
    # Annual reduction = $900 * 12 = $10,800
    bc_child_care_fee_reduction: 10_800

# --- Family/in-home multi-age care tests ---

- name: BC Child Care Fee Reduction - family care infant/toddler
  period: 2024
  input:
    people:
      parent:
        age: 30
      infant:
        age: 1
        is_family_child_care: true
    households:
      household:
        province_code: BC
        members: [parent, infant]
  output:
    bc_child_care_fee_reduction: 7_200  # $600/month * 12 (family rate)

