- name: BC Child Care Fee Reduction - infant/toddler
  period: 2024
  input:
    people:
      parent:
        age: 30
      infant:
        age: 1
    households:
      household:
        province_code: BC
        members: [parent, infant]
  output:
    bc_child_care_fee_reduction: 10_800  # $900/month * 12 (not income-tested)

