    province_code: ONT
  output:
    # adjusted_income = 60,000 + 5,000 = 65,000 -> rate 0.47 (bracket >63,600 to 67,200)
    on_child_care_tax_credit: 2_350  # 0.47 * 5,000

- name: Boundary - adjusted income just below $150,000 limit
  period: 2024
  input:
    family_net_income: 141_999
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 141,999 + 8,000 = 149,999 -> eligible (<= 150,000)
    # rate = 0.01 (bracket >146,400 to 150,000)
    on_child_care_tax_credit: 80  # 0.01 * 8,000

- name: Boundary - adjusted income just above $150,000 limit
  period: 2024
  input:
