- name: Low income family - 75% rate
  period: 2024
  input:
    family_net_income: 10_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 10,000 + 8,000 = 18,000 -> rate 0.75
    on_child_care_tax_credit: 6_000  # 0.75 * 8,000

- name: Income in 73% bracket
  period: 2024
  input:
    family_net_income: 14_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 14,000 + 8,000 = 22,000 -> rate 0.73 (bracket 20,000-22,500)
    on_child_care_tax_credit: 5_840  # 0.73 * 8,000

- name: Income in 71% bracket
  period: 2024
  input:
    family_net_income: 15_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 15,000 + 8,000 = 23,000 -> rate 0.71 (bracket 22,500-25,000)
    on_child_care_tax_credit: 5_680  # 0.71 * 8,000

- name: Income in 49% bracket
  period: 2024
  input:
    family_net_income: 45_000
    child_care_expense_deduction: 5_000
    province_code: ONT
  output:
    # adjusted_income = 45,000 + 5,000 = 50,000 -> rate 0.49 (bracket 50,000-52,500)
    on_child_care_tax_credit: 2_450  # 0.49 * 5,000

- name: Income just at limit boundary
  period: 2024
  input:
    family_net_income: 142_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 142,000 + 8,000 = 150,000 -> rate 0.00 (bracket >= 150,000)
    # eligible because adjusted_income <= 150,000, but rate is 0
    on_child_care_tax_credit: 0  # 0.00 * 8,000

- name: Income above limit - ineligible
  period: 2024
  input:
    family_net_income: 145_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 145,000 + 8,000 = 153,000 > 150,000
    on_child_care_tax_credit: 0

- name: Income in 1% bracket
  period: 2024
  input:
    family_net_income: 140_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 140,000 + 8,000 = 148,000 -> rate 0.01 (bracket 146,400-150,000)
    on_child_care_tax_credit: 80  # 0.01 * 8,000

- name: Zero child care expenses
  period: 2024
  input:
    family_net_income: 30_000
    child_care_expense_deduction: 0
    province_code: ONT
  output:
    on_child_care_tax_credit: 0

- name: Small CCED with mid-range income
  period: 2024
  input:
    family_net_income: 60_000
    child_care_expense_deduction: 5_000
    province_code: ONT
  output:
    # adjusted_income = 60,000 + 5,000 = 65,000 -> rate 0.37 (bracket 65,000-67,500)
    on_child_care_tax_credit: 1_850  # 0.37 * 5,000

- name: Boundary - adjusted income just below $150,000 limit
  period: 2024
  input:
    family_net_income: 141_999
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 141,999 + 8,000 = 149,999 -> eligible (<= 150,000)
    # rate = 0.01 (bracket 146,400-150,000)
    on_child_care_tax_credit: 80  # 0.01 * 8,000

- name: Boundary - adjusted income just above $150,000 limit
  period: 2024
  input:
    family_net_income: 142_001
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 142,001 + 8,000 = 150,001 > 150,000 -> ineligible
    on_child_care_tax_credit: 0
