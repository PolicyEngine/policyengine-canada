- name: Low income family - 75% rate
  period: 2024
  input:
    family_net_income: 10_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 10,000 + 8,000 = 18,000 -> rate 0.75 (bracket $0 to $20,000)
    on_child_care_tax_credit: 6_000  # 0.75 * 8,000

- name: Income in 73% bracket (adjusted $22,000)
  period: 2024
  input:
    family_net_income: 14_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 14,000 + 8,000 = 22,000 -> rate 0.73 (bracket >20,000 to 22,500)
    on_child_care_tax_credit: 5_840  # 0.73 * 8,000

- name: Income in 71% bracket (adjusted $23,000)
  period: 2024
  input:
    family_net_income: 15_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 15,000 + 8,000 = 23,000 -> rate 0.71 (bracket >22,500 to 25,000)
    on_child_care_tax_credit: 5_680  # 0.71 * 8,000

- name: Boundary - adjusted income exactly $20,000 stays in 75% bracket
  period: 2024
  input:
    family_net_income: 12_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 12,000 + 8,000 = 20,000 -> rate 0.75 (bracket $0 to $20,000)
    # Form says "$0 to $20,000" so $20,000 exactly is still 75%
    on_child_care_tax_credit: 6_000  # 0.75 * 8,000

- name: Boundary - adjusted income $20,001 drops to 73% bracket
  period: 2024
  input:
    family_net_income: 12_001
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 12,001 + 8,000 = 20,001 -> rate 0.73 (bracket >20,000 to 22,500)
    # Form says "more than $20,000" so $20,001 is the first integer in the 73% bracket
    on_child_care_tax_credit: 5_840  # 0.73 * 8,000

- name: Income in 55% bracket (adjusted $50,000 exactly)
  period: 2024
  input:
    family_net_income: 45_000
    child_care_expense_deduction: 5_000
    province_code: ONT
  output:
    # adjusted_income = 45,000 + 5,000 = 50,000 -> rate 0.55 (bracket >45,000 to 50,000)
    # Form says "not more than $50,000" so $50,000 is still in the 55% bracket
    on_child_care_tax_credit: 2_750  # 0.55 * 5,000

- name: Boundary - adjusted income exactly $150,000 gets 1% rate
  period: 2024
  input:
    family_net_income: 142_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 142,000 + 8,000 = 150,000 -> rate 0.01 (bracket >146,400 to 150,000)
    # Form says "not more than $150,000" so $150,000 is still in the 1% bracket
    on_child_care_tax_credit: 80  # 0.01 * 8,000

- name: Income above limit - ineligible
  period: 2024
  input:
    family_net_income: 145_000
    child_care_expense_deduction: 8_000
    province_code: ONT
  output:
    # adjusted_income = 145,000 + 8,000 = 153,000 > 150,000
    on_child_care_tax_credit: 0

- name: Income in 1% bracket
